server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA — unknown routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the backend (optional — useful when both are on the same domain)
    # location /api/ {
    #     proxy_pass http://backend:8001/;
    # }
}
